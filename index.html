<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>금이로그</title>
  <meta name="description" content="피그미다람쥐 케어 기록 노트">
  <meta name="theme-color" content="#f2f1ed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="금이로그">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2/dist/galmuri.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="pet-switch" id="petSwitch" aria-label="아이 바꾸기">
      <span class="pet-dot"></span><span id="petName">피그미</span><span class="caret">▾</span>
    </button>
    <div class="sync" id="syncState" title="동기화 상태"></div>
    <button class="icon-btn" id="openSettings" aria-label="설정">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar">
    <a href="#/today" data-tab="today"><i class="ti ti-home"></i><span>오늘</span></a>
    <a href="#/log" data-tab="log"><i class="ti ti-pen"></i><span>기록</span></a>
    <a href="#/album" data-tab="album"><i class="ti ti-photo"></i><span>앨범</span></a>
    <a href="#/month" data-tab="month"><i class="ti ti-cal"></i><span>월간</span></a>
    <a href="#/care" data-tab="care"><i class="ti ti-book"></i><span>케어시트</span></a>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="fx-layer" id="fx" aria-hidden="true"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
