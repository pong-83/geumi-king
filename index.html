<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>금이로그</title>
  <meta name="description" content="피그미다람쥐 금이의 케어 기록 노트">
  <meta name="theme-color" content="#d6e9f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="금이로그">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Silkscreen&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <button class="name-tag" id="petSwitch" aria-label="아이 바꾸기"><i></i><span id="petName">금이</span></button>
      <span class="sync" id="syncState" title="동기화 상태"></span>
      <button class="key icon-key" id="openSettings" aria-label="설정">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" shape-rendering="crispEdges"><path fill="#2f4166" d="M6 1h4v2h2v2h2v4h-2v2h-2v2H6v-2H4V9H2V5h2V3h2zm0 4v4h4V5z"/><path fill="#2f4166" d="M7 0h2v1H7zM7 15h2v1H7zM0 7h1v2H0zM15 7h1v2h-1z"/></svg>
      </button>
    </header>

    <main class="stage" id="stage"><div class="view" id="view" tabindex="-1"></div></main>

    <nav class="tabs" id="tabbar" aria-label="메뉴">
      <div class="runner" id="runner" aria-hidden="true"><img class="pix" id="runnerImg" alt=""></div>
      <a href="#/today" class="tab" data-tab="today"><img class="pix" alt=""><span>오늘</span></a>
      <a href="#/log" class="tab" data-tab="log"><img class="pix" alt=""><span>기록</span></a>
      <a href="#/album" class="tab" data-tab="album"><img class="pix" alt=""><span>앨범</span></a>
      <a href="#/month" class="tab" data-tab="month"><img class="pix" alt=""><span>월간</span></a>
      <a href="#/care" class="tab" data-tab="care"><img class="pix" alt=""><span>케어시트</span></a>
    </nav>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="fx" id="fx" aria-hidden="true"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
